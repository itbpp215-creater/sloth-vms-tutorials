    <div class="pager"><a class="nav-btn" href="10_playback_24h.html">← บทที่ 10</a><a class="nav-btn" href="12_sloth_ai_chat_bot.html">บทที่ 12 →</a></div>
  </main>
  <script>
  (function () {
    const cid = "11_watchlist_lpr_face";
    const box = document.getElementById('playerBox');
    const vid = document.getElementById('watchVideo');
    const btnP = document.getElementById('btnPort');
    const btnL = document.getElementById('btnLand');
    const btnCopy = document.getElementById('btnCopy');

    function setOri(mode, autoPlay) {
      const isPort = mode === 'port';
      btnP.classList.toggle('active', isPort);
      btnL.classList.toggle('active', !isPort);
      box.classList.toggle('is-port', isPort);
      const src = isPort ? ('../output/portrait/' + cid + '_portrait.mp4') : ('../output/landscape/' + cid + '_landscape.mp4');
      const poster = isPort ? ('../posters/' + cid + '_portrait.jpg') : ('../posters/' + cid + '_landscape.jpg');
      const wasPaused = vid.paused;
      vid.poster = poster;
      if (vid.getAttribute('src') !== src) {
        vid.setAttribute('src', src);
        vid.load();
        if (autoPlay && !wasPaused) vid.play().catch(function () {});
      }
    }

    btnP.addEventListener('click', function () { setOri('port', true); });
    btnL.addEventListener('click', function () { setOri('land', true); });
    if (btnCopy) {
      btnCopy.addEventListener('click', async function () {
        try {
          await navigator.clipboard.writeText(window.location.href);
          const orig = btnCopy.textContent;
          btnCopy.textContent = 'คัดลอกแล้ว!';
          setTimeout(function () { btnCopy.textContent = orig; }, 1600);
        } catch (_) {}
      });
    }
    setOri(window.innerWidth <= 768 ? 'port' : 'land', false);
  })();
  </script>
